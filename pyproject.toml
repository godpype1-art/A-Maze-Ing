[project]
name = "mazegen"
version = "1.0.0"
description = "A maze generator"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.14.1",
]

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
